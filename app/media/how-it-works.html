<title>How it works · the explainer film</title>
<!-- The 30-second explainer of the landing page, as one self-contained page: one timeline (seconds) drives every
     element from a pure function of time, so the film can be scrubbed, paused and restarted; no voice, no music.
     render.py turns it into media/how-it-works-<lang>.webm, which the landing page plays. The look is the app's
     (css/tokens.css, the values copied below: the page must open from disk). Open the file to review it: ?lang=de|fr|it|en,
     ?autoplay to start at once, ?paused to wait, ?nocontrols to hide the review bar (rendering), ?loop to repeat,
     ?speed=1.3 to try a faster pace. The stage is 1280 x 720 and scales to the window. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --accent: #2f6ea6; --accent-text: #22557f; --accent-light: #eef3f8; --accent-border: #a9c1d8; --on-accent: #fff;
  --text: #1a1d21; --muted: #646b74; --border: #dfe2e6; --border-light: #f0f1f3; --bg: #f5f6f7; --bg-track: #eef0f2; --surface: #fff;
  --success: #2e9e5b; --success-bg: #e6f4ec; --success-text: #1f7a45; --warning: #d99a1e; --danger: #d0433b;
  --walls: #2b3a55; --doors: #d0433b; --windows: #2f8fd8; --gf: #111827; --region: #e67800; --ink: #2c2f36;
  --pal-1: #4e79a7; --pal-2: #f28e2b; --pal-3: #59a14f; --pal-4: #e15759; --pal-5: #76b7b2;
  --font: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r-ctl: 8px; --r-lg: 10px; --r-xl: 12px; --r-pill: 999px;
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, .06); --shadow-md: 0 6px 20px rgba(0, 0, 0, .1);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #e9ebee; font-family: var(--font); color: var(--text); }
body { display: grid; grid-template-rows: 1fr auto; place-items: center; gap: 12px; padding: 16px; }
.frame { position: relative; width: 1280px; height: 720px; transform-origin: top left; }
.stage { position: absolute; inset: 0; overflow: hidden; background: var(--bg); border-radius: var(--r-xl); box-shadow: var(--shadow-md); font-size: 14px; line-height: 1.45; }
.stage > * { position: absolute; }
.hidden { visibility: hidden; }
/* the app frame */
.topbar { left: 0; right: 0; top: 0; height: 56px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; font-size: 15px; }
.brand { font-weight: 600; }
.crumb { color: var(--muted); margin-left: 10px; }
.crumb::before { content: '/'; color: var(--border); margin-right: 10px; }
.btn { height: 32px; padding: 0 14px; border: 1px solid var(--border); border-radius: var(--r-ctl); background: var(--surface); font: inherit; font-size: 13px; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.btn-primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
.btn-xl { height: 44px; padding: 0 20px; font-size: 15px; justify-content: center; }
.btn.pressed { transform: translateY(1px); filter: brightness(.92); }
.topbar .right { display: flex; gap: 10px; }
.screen { left: 0; right: 0; top: 56px; bottom: 92px; }
.screen > * { position: absolute; }
/* the caption strip: large, one idea, readable on a phone */
.caption { left: 0; right: 0; bottom: 0; height: 92px; background: var(--surface); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: center; padding: 0 40px; text-align: center; }
.caption .text { font-size: 30px; font-weight: 600; line-height: 1.25; letter-spacing: -.01em; }
/* the title and end cards */
.card-full { inset: 0; display: grid; place-items: center; text-align: center; background: var(--surface); }
.card-full h1 { font-size: 48px; margin: 0 0 12px; font-weight: 600; letter-spacing: -.01em; }
.card-full p { font-size: 24px; color: var(--muted); margin: 0; }
.card-full .mark { font-size: 15px; color: var(--accent-text); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 18px; }
/* upload */
.dropzone { left: 320px; top: 110px; width: 640px; height: 280px; border: 2px dashed var(--accent-border); border-radius: var(--r-xl); background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; font-size: 18px; }
.dropzone small { font-size: 13px; color: var(--muted); }
.dropzone.over { background: var(--accent-light); }
.progress { left: 320px; top: 410px; width: 640px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 14px 18px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.progress .row { display: flex; justify-content: space-between; }
.progress .row span:last-child { color: var(--muted); }
.progress .line { height: 6px; border-radius: 3px; background: var(--bg-track); overflow: hidden; }
.progress .line i { display: block; height: 100%; background: var(--accent); width: 0; }
/* the sheet (the drawing) */
.sheet { left: 0; top: 0; width: 760px; height: 520px; background: var(--surface); box-shadow: 0 2px 12px rgba(0, 0, 0, .12); transform-origin: top left; }
.sheet svg { display: block; width: 100%; height: 100%; }
/* the side panel of the steps */
.panel { right: 0; top: 0; bottom: 0; width: 400px; background: var(--surface); border-left: 1px solid var(--border); padding: 28px; display: flex; flex-direction: column; gap: 16px; }
.panel .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent-text); }
.panel h2 { margin: 0; font-size: 20px; font-weight: 600; }
.panel p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
.panel .kv { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
.panel .kv span:first-child { color: var(--muted); }
.panel .kv .big { font-size: 20px; font-weight: 600; }
.panel .foot { margin-top: auto; display: flex; gap: 10px; }
.panel .foot .btn-primary { flex: 1; }
.pill { left: 50%; top: 20px; transform: translateX(-50%); height: 36px; padding: 0 16px; border-radius: var(--r-pill); background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-sm); display: flex; align-items: center; gap: 8px; font-size: 13px; white-space: nowrap; }
.pill b { font-weight: 600; }
.steps { display: flex; gap: 6px; }
.steps span { height: 4px; flex: 1; border-radius: 2px; background: var(--border); }
.steps span.on { background: var(--accent); }
/* results */
.side { top: 0; bottom: 0; background: var(--surface); padding: 16px; font-size: 13px; display: flex; flex-direction: column; gap: 10px; }
.side.left { left: 0; width: 260px; border-right: 1px solid var(--border); }
.side.right { right: 0; width: 400px; border-left: 1px solid var(--border); padding: 24px; gap: 14px; }
.side h2 { margin: 0; font-size: 17px; font-weight: 600; }
.group { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; margin-top: 6px; }
.group::before { content: ''; width: 10px; height: 10px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg) translate(-2px, -2px); margin-right: 2px; }
.layer { display: flex; align-items: center; gap: 8px; padding: 3px 4px 3px 22px; font-size: 13px; }
.layer .sw, .table .sw { width: 12px; height: 12px; border-radius: 3px; flex: none; }
.layer .n { flex: 1; }
.eye { width: 16px; height: 16px; color: var(--muted); display: inline-flex; }
.kv-grid { display: grid; grid-template-columns: 1fr auto; row-gap: 6px; font-size: 14px; }
.kv-grid span:nth-child(odd) { color: var(--muted); }
.kv-grid span:nth-child(even) { text-align: right; }
.kv-grid .strong { font-weight: 600; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: var(--r-pill); font-size: 12px; font-weight: 600; background: var(--success-bg); color: var(--success-text); }
.badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--success); }
.table { border: 1px solid var(--border); border-radius: var(--r-ctl); font-size: 12px; overflow: hidden; }
.table .tr { display: grid; grid-template-columns: 12px 1fr 56px 52px; gap: 8px; padding: 6px 10px; border-top: 1px solid var(--border-light); align-items: center; }
.table .tr:first-child { border-top: 0; background: var(--bg); color: var(--muted); font-weight: 600; }
.table .tr.on { background: var(--accent-light); }
.table .ar { text-align: right; color: var(--muted); }
.table .cf { text-align: right; font-weight: 600; color: var(--success-text); }
.popup { width: 250px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-md); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.popup b { font-size: 15px; }
.popup .kv-grid { font-size: 12px; }
.leader { inset: 0; pointer-events: none; }
.leader svg { width: 100%; height: 100%; display: block; }
.menu { right: 150px; top: 46px; min-width: 280px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-md); padding: 6px; display: flex; flex-direction: column; font-size: 13px; z-index: 5; }
.menu div { padding: 8px 10px; border-radius: 6px; display: flex; flex-direction: column; gap: 1px; }
.menu div small { color: var(--muted); }
.menu div.on { background: var(--bg); }
.stage-bottom { left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 8px 14px; box-shadow: var(--shadow-md); font-size: 12px; display: flex; gap: 14px; align-items: center; }
.seg { display: inline-grid; grid-auto-flow: column; border: 1px solid var(--border); border-radius: var(--r-ctl); overflow: hidden; }
.seg span { padding: 6px 10px; font-size: 12px; }
.seg span.on { background: var(--accent); color: var(--on-accent); font-weight: 600; }
/* the cursor and its click ripple */
.cursor { left: 0; top: 0; width: 22px; height: 28px; z-index: 20; pointer-events: none; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .35)); }
.ripple { left: 0; top: 0; width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--accent); z-index: 19; pointer-events: none; transform: translate(-50%, -50%) scale(0); opacity: 0; }
/* the review bar */
.bar { width: 1280px; max-width: 100%; display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.bar button { height: 32px; padding: 0 12px; border: 1px solid var(--border); border-radius: var(--r-ctl); background: var(--surface); font: inherit; font-size: 13px; cursor: pointer; }
.bar button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.bar input[type=range] { flex: 1; min-width: 160px; accent-color: var(--accent); }
.bar .scenes, .bar .langs { display: flex; gap: 4px; }
.bar .scenes span { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: var(--surface); border: 1px solid var(--border); cursor: pointer; }
.bar .scenes span.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.bar .time { font-variant-numeric: tabular-nums; min-width: 72px; text-align: right; }
.bar.nocontrols { display: none; }
</style>
</head>

  <span class="scenes" id="scenes"></span>
  <span class="langs" id="langs"></span>
</div>

  [...gOpen.children].forEach((o, i) => o.setAttribute('opacity', now < T4 ? span(now, 17.6 + i * .14, 17.9 + i * .14) : 1));

// ------------------------------------------------------------------------------------------------- play, scrub, fit
let tNow = 0, playing = true, last = performance.now();
const scrub = document.getElementById('scrub'), timeEl = document.getElementById('time'), playBtn = document.getElementById('play');
const scenesEl = document.getElementById('scenes'), langsEl = document.getElementById('langs');
for (const [at, key] of SCENES) scenesEl.append(h('span', { 'data-at': at }, t(key)));
scenesEl.addEventListener('click', (e) => { const s = e.target.closest('span'); if (s) seek(+s.dataset.at); });
for (const l of LANGS) { const b = h('button', { class: l === LANG ? 'on' : '' }, l.toUpperCase()); b.onclick = () => { const u = new URL(location.href); u.searchParams.set('lang', l); location.href = u; }; langsEl.append(b); }
function seek(sec) { tNow = clamp(sec, 0, TOTAL); render(tNow); scrub.value = tNow; timeEl.textContent = `${tNow.toFixed(1)} / ${TOTAL.toFixed(1)} s`;
  for (const s of scenesEl.children) s.classList.toggle('on', tNow >= +s.dataset.at && tNow < (+(s.nextSibling && s.nextSibling.dataset.at) || T5)); }
function loop(ts) {

playBtn.onclick = () => { playing = !playing; playBtn.textContent = playing ? 'Pause' : 'Play'; if (playing && tNow >= TOTAL) tNow = 0; };

if (Q.has('nocontrols')) { document.getElementById('bar').classList.add('nocontrols'); document.body.style.padding = '0'; document.body.style.gap = '0'; document.body.style.background = 'var(--bg)'; stage.style.borderRadius = '0'; stage.style.boxShadow = 'none'; fit(); }
