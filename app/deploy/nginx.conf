# nginx site of the floor plan workflow app, installed by app/deploy/setup.sh as /etc/nginx/sites-available/fpx-app
# with __DOMAIN__, __WEBROOT__ and __ROOT__ filled in. HTTPS in front of app/server.py --public (127.0.0.1:8765 only): open to
# anyone without a login, new sheet jobs and pipeline runs rate-limited per visitor, no access log and only critical
# errors logged (request lines carry upload names).
# The app must sit at the root of its (sub)domain: the page calls /api/... with absolute paths.

map $request_method $fpx_post {                                      # only POSTs count against the limits
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $fpx_post zone=fpx_new_job:10m rate=6r/m;
limit_req_zone $fpx_post zone=fpx_work:10m rate=12r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ { root __WEBROOT__; }     # Let's Encrypt renewals
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log           off;
    error_log            /var/log/nginx/error.log crit;              # an error line would quote the request, with upload names
    server_tokens        off;
    client_max_body_size 300m;                                       # app/server.py MAX_UPLOAD
    client_body_timeout  300s;

    gzip            on;                                              # JSON results, scripts and styles (the server sends weak ETags)
    gzip_types      application/json text/css text/javascript application/javascript image/svg+xml text/csv text/plain;
    gzip_min_length 1024;
    gzip_proxied    any;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           DENY always;
    add_header Referrer-Policy           same-origin always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;

    proxy_set_header   Host              $host;                      # server.py compares it with the Origin of writes
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for; # also marks a request as not local (the full health check)
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8765;
    }

    location /media/ {                                               # the explainer film of the landing page: from disk,
        alias __ROOT__/app/media/;                                   # with byte ranges (seeking) and a day of caching
        expires 1d;
    }

    location ~ ^/api/(upload|demo)$ {                                # a new sheet job: 6 a minute per visitor, burst 5
        limit_req        zone=fpx_new_job burst=5 nodelay;
        limit_req_status 429;
        proxy_pass       http://127.0.0.1:8765;
    }

    location ~ ^/api/sheets/[^/]+/(run|scale)$ {                     # pipeline work on a sheet: 12 a minute per visitor, burst 10
        limit_req        zone=fpx_work burst=10 nodelay;
        limit_req_status 429;
        proxy_pass       http://127.0.0.1:8765;
    }
}

server {                                                             # any other name and the bare IP: no answer
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
    return 444;
}
